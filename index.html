<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      /* 加上一個覆蓋層，讓用戶點擊來啟動影片 */
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); z-index: 10;
        display: flex; justify-content: center; align-items: center;
        color: white; font-family: sans-serif; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="overlay">點擊螢幕開始觀賞</div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video id="ar-video-entity" src="#v" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>
      
      <a-assets>
        <video id="v" src="movie.mp4" 
               loop="true" 
               crossorigin="anonymous" 
               muted="true" 
               playsinline 
               webkit-playsinline>
        </video>
      </a-assets>
    </a-scene>

    <script>
      // 當用戶點擊覆蓋層時，隱藏提示並強制播放影片
      const overlay = document.querySelector('#overlay');
      const video = document.querySelector('#v');
      
      overlay.addEventListener('click', () => {
        video.play();
        overlay.style.display = 'none';
      });

      // 監測 AR 追蹤狀態 (選用：增加穩定性)
      video.addEventListener('error', (e) => {
        console.error("影片載入失敗，請檢查檔案名稱與路徑");
      });
    </script>
  </body>
</html>
