<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Movie Ticket</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene
      embedded
      arjs="trackingMethod: nft; sourceType: webcam; debugUIEnabled: false;"
    >
      <a-nft
        type="nft"
        url="./ticket"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5"
      >
        <a-video
          src="#ar-video"
          width="160"
          height="90"
          position="80 45 0"
          rotation="-90 0 0"
        >
        </a-video>
      </a-nft>

      <a-entity camera></a-entity>

      <a-assets>
        <video
          id="ar-video"
          src="movie.mp4"
          preload="auto"
          loop="true"
          autoplay="true"
          muted="true"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        >
        </video>
      </a-assets>
    </a-scene>
  </body>
</html>
