<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover">
    <title>AR Movie Ticket</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
      /* 強制網頁全螢幕，不留白邊 */
      body { margin: 0; overflow: hidden; width: 100%; height: 100%; position: fixed; }
      .arjs-loader {
        height: 100%; width: 100%; position: absolute; top: 0; left: 0;
        background-color: rgba(0, 0, 0, 0.8); z-index: 9999;
        display: flex; justify-content: center; align-items: center;
      }
      .arjs-loader div { text-align: center; color: white; font-family: sans-serif; }
    </style>
  </head>

  <body>
    <div class="arjs-loader">
      <div>動畫載入中，請稍候...</div>
    </div>

    <a-scene
      embedded
      arjs="trackingMethod: nft; sourceType: webcam; debugUIEnabled: false; precision: medium;"
      vr-mode-ui="enabled: false">
      
      <a-nft
        type="nft"
        url="./ticket" 
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5">
        
        <a-video
          src="#ar-video"
          width="160"
          height="90"
          position="80 45 0"
          rotation="-90 0 0">
        </a-video>
      </a-nft>

      <a-entity camera></a-entity>

      <a-assets>
        <video
          id="ar-video"
          src="movie.mp4"
          preload="auto"
          loop="true"
          autoplay="true"
          muted="true"
          playsinline
          webkit-playsinline
          crossorigin="anonymous">
        </video>
      </a-assets>
    </a-scene>
  </body>
</html>
